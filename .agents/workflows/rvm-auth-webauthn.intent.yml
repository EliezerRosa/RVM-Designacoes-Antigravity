    ### Tabela de invariantes

    | Inv | Statement (resumo) | Status | Evidencia | Justificativa |
    |---|---|:---:|---|---|
    | I-1 | Session via generateLink+verifyOtp | ✅/❌ | <grep output> | <por que passa> |
    | I-2 | Credenciais em SQL com RLS | ✅/❌ | <SQL result> | ... |
    | I-3 | Challenge server-side single-use | ✅/❌ | <grep output> | ... |
    | I-4 | Zero regressao no portal / RLS | ✅/❌ | <git diff> | ... |
    | I-5 | Zero secret em cliente/migration | ✅/❌ | <grep output> | ... |

    ### Oracle gates executados

    | Gate | Comando | Resultado |
    |---|---|---|
    | typecheck | npx tsc --noEmit | PASS / FAIL |
    | build | npm run build | PASS / FAIL |
    | migration_syntax | grep IF NOT EXISTS | PASS |
    | scope_diff | git status vs escopo | PASS |
    | invariant_grep | multiplos | PASS |

    ### Arquivos entregues

    - CREATE: <lista>
    - UPDATE: <lista>
    - DELETE: <lista> (esperado: vazio)

    ### Riscos residuais conhecidos

    - <riscos que sobraram e por que sao aceitaveis>

    ### Proximos passos sugeridos (fora deste PoC)

    - <ex: adicionar painel admin de gerenciamento; adicionar rate limit;
      escrever testes E2E>

# -----------------------------------------------------------------------------
# TERMOS DE ENCERRAMENTO
# -----------------------------------------------------------------------------
closure_conditions:
  success: |
    Todas 5 invariantes com ✅ + todos os oracle_gates PASS + aprovacao
    humana em CP-final + commit + push OK.
  abort: |
    Qualquer invariante ❌ que nao possa ser corrigida sem violar outra.
    Nesse caso: git stash + reportar razao + aguardar decisao do Eliezer.

memory_write_on_close:
  - path: /memories/repo/rvm-auth-webauthn-poc-idd-2026-08-14.md
    content: |
      Snapshot do que foi feito, invariantes finais, comandos executados,
      links para arquivos alterados e commits produzidos.
  - update: /memories/repo/_ESTADO-ATUAL.md
    section: ultima_atualizacao
