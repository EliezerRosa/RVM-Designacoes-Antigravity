name: WhatsApp Queue Consumer (Headless)

on:
  repository_dispatch:
    types: [consume-whatsapp-queue]
  workflow_dispatch: # Permite disparo manual

concurrency:
  group: whatsapp-queue-consumer
  cancel-in-progress: false # Não cancela, apenas enfileira para evitar duplicação

jobs:
  consume-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Dá tempo suficiente para processar centenas de mensagens com delay de 3s

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Run Consumer Bot
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}
          TZ: America/Sao_Paulo
        run: npx tsx scripts/whatsapp-queue-consumer.ts
