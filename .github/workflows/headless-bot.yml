name: Automation Bot (Headless)

on:
  schedule:
    # Roda diariamente as 11:00 UTC (08:00 BRT)
    - cron: '0 11 * * *'
  workflow_dispatch: # Permite rodar manualmente pelo painel do GitHub Actions

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm ci
          npx puppeteer browsers install chrome

      - name: Run headless bot
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          TZ: America/Sao_Paulo
        run: |
          if [ -z "$WORKER_URL" ]; then
            echo "ERRO: Secret WORKER_URL não configurado. Abortando."
            exit 1
          fi
          node scripts/headless-bot.js
