name: Automation Bot (Headless)

on:
  schedule:
    # Roda diariamente as 11:00 UTC (08:00 BRT)
    - cron: '0 11 * * *'
  workflow_dispatch: # Permite rodar manualmente pelo painel do GitHub Actions

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install puppeteer

      - name: Run headless bot
        env:
          WORKER_URL: ${{ secrets.WORKER_URL || 'https://rvm-designacoes-antigravity.vercel.app/?portal=automation-worker&token=rvm_bot_8f4a1c9e2b7d3f5a0e6c8b1d4e7a9f2c' }}
        run: node scripts/headless-bot.js
