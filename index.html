<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- Security: Content Security Policy -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.z-api.io http://localhost:* ws://localhost:*; worker-src 'self' blob:; frame-src 'self' https://*.supabase.co;" />
  <!-- Cache Control: Force browser to revalidate on each request -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  
  <!-- PWA Settings -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RVM Designações" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <script>
    (function () {
      function isTrustedReturnUrl(u) {
        if (!u) return false;
        return (
          u.indexOf('https://eliezerrosa.github.io/') === 0 ||
          u.indexOf('https://rvm-designacoes-antigravity.vercel.app/') === 0 ||
          u.indexOf('http://localhost:') === 0 ||
          u.indexOf('http://127.0.0.1:') === 0
        );
      }

      function hasValidStoredSession(raw) {
        if (!raw) return false;
        try {
          var parsed = JSON.parse(raw);
          var token = parsed && parsed.access_token;
          if (!token) return false;
          var exp = Number(parsed.expires_at || '0');
          if (exp && exp * 1000 < Date.now() + 30000) return false;
          return true;
        } catch (e) {
          return false;
        }
      }

      try {
        var params = new URLSearchParams(window.location.search);
        var returnTo = params.get('oauth_return_to');
        var ssoSilent = params.get('sso_silent') === '1';

        if (returnTo && isTrustedReturnUrl(returnTo)) {
          var existingAuth = localStorage.getItem('rvm-designacoes-auth');
          if (hasValidStoredSession(existingAuth)) {
            var encodedSso = encodeURIComponent(btoa(unescape(encodeURIComponent(existingAuth))));
            window.location.replace(returnTo.split('#')[0] + '#conversa_sso=' + encodedSso);
            return;
          }
          if (ssoSilent) {
            var sep = returnTo.indexOf('?') >= 0 ? '&' : '?';
            window.location.replace(returnTo.split('#')[0] + sep + 'sso_checked=1');
            return;
          }
          localStorage.setItem('rvm_conversa_oauth_return', returnTo.split('#')[0]);
          localStorage.setItem('rvm_conversa_oauth_ts', String(Date.now()));
        }

        var ret = localStorage.getItem('rvm_conversa_oauth_return');
        var ts = Number(localStorage.getItem('rvm_conversa_oauth_ts') || '0');
        if (ret && Date.now() - ts < 300000 && !window.location.pathname.endsWith('conversa.html')) {
          localStorage.removeItem('rvm_conversa_oauth_return');
          localStorage.removeItem('rvm_conversa_oauth_ts');
          if ((window.location.hash || '').indexOf('access_token=') >= 0) {
            window.location.replace(ret.split('#')[0] + window.location.hash);
            return;
          }
          var storedNow = localStorage.getItem('rvm-designacoes-auth');
          if (hasValidStoredSession(storedNow)) {
            var ssoPayload = encodeURIComponent(btoa(unescape(encodeURIComponent(storedNow))));
            window.location.replace(ret.split('#')[0] + '#conversa_sso=' + ssoPayload);
            return;
          }
          window.location.replace(ret.split('#')[0] + (window.location.hash || ''));
          return;
        }
      } catch (e) {}
    })();
  </script>
  <script src="./registerSW.js" defer></script>
  
  <title>RVM Designações</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
